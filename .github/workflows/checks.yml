name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit SHA, so a moved tag cannot change what
      # runs. Dependabot proposes the updates (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the version-bump check can diff against the base.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Pinned, because the plugin validator's behaviour is the thing being
      # checked. Bump it deliberately, with the rest of the plugin changes.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.282

      - name: Validate the marketplace and every plugin
        run: |
          claude plugin validate .
          for dir in plugins/*/; do
            claude plugin validate "$dir"
          done

      # Skills cannot import each other, so shared guidance is a copy per
      # skill. This is what keeps the copies from drifting apart silently.
      - name: Shared blocks identical across skills
        run: node scripts/check-shared-blocks.mjs

      - name: Repository consistency and version bumps
        if: github.event_name == 'pull_request'
        run: node scripts/check-repo.mjs --base "${{ github.event.pull_request.base.sha }}"

      - name: Repository consistency
        if: github.event_name != 'pull_request'
        run: node scripts/check-repo.mjs

      # The audit scripts ship to users and run with no install step, so a
      # syntax error reaches them directly.
      - name: Scripts parse
        run: |
          rc=0
          while IFS= read -r f; do
            node --check "$f" || rc=1
          done < <(find plugins scripts tests -name '*.mjs' -type f)
          exit $rc

      - name: Script behaviour
        run: node --test tests/scripts.test.mjs

      - name: Licensing metadata
        run: pipx run reuse lint
